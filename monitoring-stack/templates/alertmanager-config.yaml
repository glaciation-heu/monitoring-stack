apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |-
    route:
      group_interval: 5m
      group_wait: 30s
      receiver: 'null'
      repeat_interval: 4h
      routes:
        - matchers:
            - severity=~"warning|critical|none"
          receiver: 'slack alert'

    receivers:
      - name: 'null'
      - name: 'slack alert'
        slack_configs:
          - api_url_file: /etc/secrets/slack-api-url
            channel: '#alerting'
            send_resolved: true
            title: |-
              {{`{{- if eq (index .Alerts 0).Status "resolved" -}}`}}
              Houston, the eagle has landed! :rocket:
              {{`{{- else -}}`}}
              Houston, we have a problem! :anger:
              {{`{{- end }}`}}
            text: |-
              {{`{{- range .Alerts }}`}}
              *Severity:* `{{`{{ .Labels.severity }}`}}` :fire: {{`{{ .Labels.responsible }}`}}
              *Summary:* {{`{{ .Annotations.summary }}`}}
              *Description:* {{`{{ .Annotations.description }}`}}
              {{`{{- if .Labels.location }}`}}
              *Location:* `{{`{{ .Labels.location }}`}}`
              {{`{{- else if .Labels.instance }}`}}
              *Instance:* `{{`{{ .Labels.instance }}`}}`
              {{`{{- end }}`}}
              {{`{{- "\\n" -}}`}}
              {{`{{- end }}`}}

