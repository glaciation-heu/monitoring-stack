groups:
  - name: PVCUsage
    rules:
      - alert: PvcUsageHigh
        expr: '100.0 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 80'
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High PVC usage detected ({{ $labels.persistentvolumeclaim }})"
          description: "PersistentVolumeClaim {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is using more than 80% of its capacity."
